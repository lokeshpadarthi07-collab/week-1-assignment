<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#090d16" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Code Bracket Icon </ > -->
  <g filter="url(#glow)">
    <!-- Left Angle Bracket < -->
    <path d="M 180 150 L 80 256 L 180 362" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Slash / -->
    <path d="M 285 135 L 227 377" stroke="#06b6d4" stroke-width="44" stroke-linecap="round" fill="none"/>
    <!-- Right Angle Bracket > -->
    <path d="M 332 150 L 432 256 L 332 362" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
